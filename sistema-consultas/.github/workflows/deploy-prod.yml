name: Deploy app

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  build-and-deploy:
    runs-on: prod-consult
    steps:
      - name: Pull latest changes from the repository
        run: |
          git pull
        working-directory: ${{ secrets.LOCAL_REPOSITORY }}   
      
      - name: Build Docker images
        run: |
          docker-compose build
        working-directory: ${{ secrets.LOCAL_REPOSITORY }}     
  
      - name: Stop and remove old containers
        run: |
          docker-compose down
        working-directory: ${{ secrets.LOCAL_REPOSITORY }}   
  
      - name: Deploy application
        run: |
          docker-compose up -d
        working-directory: ${{ secrets.LOCAL_REPOSITORY }}
