version: '3'

services:
  app:
    container_name: sistema-consultas
    build: .
    restart: always
    network_mode: host
    volumes:
      - ./src:/var/www/html/src:delegated
    depends_on:
      - redis

  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass teste123
    volumes: 
      - cache:/data

volumes:
  cache:
    driver: local
